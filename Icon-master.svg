  <!--
    Pixel-art master, one <rect> per contiguous same-color run on a 32x32
    grid (32px == this project's own TileWidth, Data/TileSetData.cs) --
    matches scratchpad/make_pixel_icon.py's row(y, spans) table exactly.
    shape-rendering="crispEdges" keeps hard pixel edges at any display size;
    Icon.ico itself is rendered by upscaling/downscaling the source 32x32 PNG
    with nearest-neighbor sampling, not by rasterizing this SVG.
